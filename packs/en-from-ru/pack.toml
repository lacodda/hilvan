[[formula]]
id = "phrasal-verb-object"
name = "Выключи свет - фразовый глагол"
pattern = "Can you + <phrasal>?"
say = "Can you <phrasal:verb> <phrasal:particle> <phrasal:thing>?"
accept = ["Can you <phrasal:verb> <phrasal:thing> <phrasal:particle>?"]
explanation = "Фразовый глагол - глагол с маленьким словом-частицей (off, on, up), и вместе они значат совсем другое, чем по отдельности: turn - поворачивать, а turn off - выключать, pick - выбирать, а pick up - поднимать или брать трубку. Запоминать такую пару нужно целиком, как одно слово. Если у глагола есть предмет - the light, the phone, - частица может стоять и до него, и после: turn off the light и turn the light off правильны оба."
order = 320
parents = ["modal-can-question"]

