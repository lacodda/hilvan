# ---------------------------------------------------------------------------
# 2. there is / there are, have got - everyday existence and possession
# ---------------------------------------------------------------------------

[[formula]]
id = "there-is-are"
name = "Там есть - there is / there are"
pattern = "There is/are + <thing>"
say = "There <thing:be> <thing>."
explanation = "По-русски «в холодильнике есть молоко» начинается с места, а по-английски начинается с формулы there is/are - буквально «там имеется». Is берём для одного предмета, are - для нескольких. Ошибка новичка - переводить дословно и начинать с места («In the fridge is milk») или путать is/are по числу."
order = 40

  [[formula.sample]]
  native = "В холодильнике есть молоко."
  target = "There is milk in the fridge."

  [[formula.sample]]
  native = "В парке есть скамейки."
  target = "There are benches in the park."

  [[formula.sample]]
  native = "На кухне есть стол."
  target = "There is a table in the kitchen."

  [[formula.sample]]
  native = "На улице пробки."
  target = "There are traffic jams outside."

  [[formula.sample]]
  native = "В городе есть хороший ресторан."
  target = "There is a good restaurant in the city."

  [[formula.slot]]
  name = "thing"
  values = [
    { native = "молоко", target = "milk", be = "is" },
    { native = "стол", target = "a table", be = "is" },
    { native = "скамейки", target = "benches", be = "are" },
    { native = "проблема", target = "a problem", be = "is" },
    { native = "хороший ресторан", target = "a good restaurant", be = "is" },
    { native = "пробки", target = "traffic jams", be = "are" },
    { native = "магазин", target = "a shop", be = "is" },
