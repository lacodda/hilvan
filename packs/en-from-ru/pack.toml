id = "en-from-ru"
version = 3
native = "ru"
target = "en"

# ---------------------------------------------------------------------------
# 1. to be (present) - the foundation formula everything else assumes
# ---------------------------------------------------------------------------

[[formula]]
id = "be-present-statement"
name = "Я есть - to be в настоящем"
pattern = "<pronoun> + am/is/are + <rest>"
say = "<pronoun> <pronoun:be> <rest>."
explanation = "В русском мы говорим «я дома», «он врач» без всякой связки, а в английском связка обязательна: I am, he/she/it is, we/you/they are. Самая частая ошибка русскоговорящего - выбросить эту связку вообще, сказать «I doctor» вместо «I am a doctor». Запомните её просто как часть местоимения: I am, you are, he is - одно целое, которое нельзя разорвать."
order = 10
family = "be-present"
form = "statement"

  [[formula.sample]]
  native = "Я дома."
  target = "I am at home."

  [[formula.sample]]
  native = "Он врач."
  target = "He is a doctor."

  [[formula.sample]]
  native = "Мы готовы."
  target = "We are ready."

  [[formula.sample]]
  native = "Она на работе."
  target = "She is at work."

  [[formula.sample]]
  native = "Они друзья."
  target = "They are friends."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I", be = "am" },
    { native = "ты", target = "you", be = "are" },
    { native = "он", target = "he", be = "is" },
    { native = "она", target = "she", be = "is" },
    { native = "оно", target = "it", be = "is" },
    { native = "мы", target = "we", be = "are" },
    { native = "они", target = "they", be = "are" },
  ]

  [[formula.slot]]
  name = "rest"
  values = [
    { native = "дома", target = "at home" },
    { native = "на работе", target = "at work" },
    { native = "готов", target = "ready" },
    { native = "уставший", target = "tired" },
    { native = "врач", target = "a doctor" },
    { native = "друг", target = "a friend" },
    { native = "занят", target = "busy" },
  ]

[[formula]]
id = "be-present-negation"
name = "Я не - to be, отрицание"
pattern = "<pronoun> + am not/isn't/aren't + <rest>"
say = "<pronoun> <pronoun:be-not> <rest>."
explanation = "Отрицание строится той же связкой плюс not: am not, isn't, aren't. В разговоре почти всегда используют слитную форму isn't и aren't, а с I говорят am not (сокращения I'm not). Ошибка новичка - добавить don't туда, где уже есть am/is/are: «I don't tired» вместо «I'm not tired» - с to be частица do не нужна никогда."
order = 20
family = "be-present"
form = "negation"

  [[formula.sample]]
  native = "Я не голоден."
  target = "I'm not hungry."

  [[formula.sample]]
  native = "Он не дома."
  target = "He isn't at home."

  [[formula.sample]]
  native = "Мы не готовы."
  target = "We aren't ready."

  [[formula.sample]]
  native = "Она не занята."
  target = "She isn't busy."

  [[formula.sample]]
  native = "Они не здесь."
  target = "They aren't here."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I", be-not = "am not" },
    { native = "ты", target = "you", be-not = "aren't" },
    { native = "он", target = "he", be-not = "isn't" },
