[[formula]]
id = "present-continuous-statement"
name = "Я делаю сейчас - Present Continuous"
pattern = "<pronoun> + am/is/are + <verb-ing> + <rest>"
say = "<pronoun> <pronoun:be> <verb-ing>."
accept = ["<pronoun:short> <verb-ing>."]
explanation = "Эта формула - для действия прямо сейчас, в эту минуту, в отличие от Present Simple, который про обычные дела вообще. Собирается из уже знакомой связки am/is/are плюс глагол с окончанием -ing: I'm working, she's cooking. Ошибка новичка - использовать здесь Present Simple там, где по-русски «сейчас» подразумевается, но не сказано словом: «Что ты делаешь?» - это всегда Continuous, «What are you doing?», а не «What do you do?»."
