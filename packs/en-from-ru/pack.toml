# ---------------------------------------------------------------------------
# 3. Present Simple - everyday routine, first "real" verb tense
# ---------------------------------------------------------------------------

[[formula]]
id = "present-simple-statement"
name = "Я делаю - Present Simple"
pattern = "<pronoun> + <verb> + <rest>"
say = "<pronoun> <verb> <rest>."
explanation = "Это формула для обычных, повторяющихся дел: то, что вы делаете вообще, каждый день, а не прямо сейчас. Глагол берётся в самой простой форме, без всяких добавок - I work, you live, we play. Проблем здесь обычно немного, но помните: эта формула не подходит для он/она/оно - там появляется своя, со звуком -s (следующая формула)."
order = 60
family = "present-simple"
form = "statement"

  [[formula.sample]]
  native = "Я работаю в офисе."
  target = "I work in an office."

  [[formula.sample]]
  native = "Мы живём в Москве."
  target = "We live in Moscow."

  [[formula.sample]]
  native = "Ты много читаешь."
  target = "You read a lot."

  [[formula.sample]]
  native = "Они играют в футбол по субботам."
  target = "They play football on Saturdays."

  [[formula.sample]]
  native = "Я пью кофе по утрам."
  target = "I drink coffee in the morning."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I" },
    { native = "ты", target = "you" },
    { native = "мы", target = "we" },
    { native = "они", target = "they" },
  ]

  [[formula.slot]]
  name = "verb"
  values = [
    { native = "работаю", target = "work" },
    { native = "живу", target = "live" },
    { native = "читаю", target = "read" },
    { native = "играю", target = "play" },
    { native = "пью", target = "drink" },
