[[formula]]
id = "present-continuous-negation"
name = "Я не делаю сейчас - Continuous, отрицание"
pattern = "<pronoun> + am not/isn't/aren't + <verb-ing>"
say = "<pronoun> <pronoun:be-not> <verb-ing>."
accept = ["<pronoun> <pronoun:be> not <verb-ing>.", "<pronoun:short> not <verb-ing>."]
explanation = "Отрицание в Continuous устроено так же, как у обычного to be: not добавляется прямо к am/is/are - I'm not working, she isn't sleeping. Никакого don't/doesn't здесь нет и быть не может - это частая путаница, потому что глагол на -ing сбивает с толку и хочется добавить do."
order = 300
parents = ["be-present-negation", "present-continuous-statement"]
family = "present-continuous"
form = "negation"

