# ---------------------------------------------------------------------------
# 9. Present Continuous - what's happening right now
# ---------------------------------------------------------------------------

[[formula]]
id = "present-continuous-statement"
name = "Я делаю сейчас - Present Continuous"
pattern = "<pronoun> + am/is/are + <verb-ing> + <rest>"
say = "<pronoun> <pronoun:be> <verb-ing>."
explanation = "Эта формула - для действия прямо сейчас, в эту минуту, в отличие от Present Simple, который про обычные дела вообще. Собирается из уже знакомой связки am/is/are плюс глагол с окончанием -ing: I'm working, she's cooking. Ошибка новичка - использовать здесь Present Simple там, где по-русски «сейчас» подразумевается, но не сказано словом: «Что ты делаешь?» - это всегда Continuous, «What are you doing?», а не «What do you do?»."
order = 290

  [[formula.sample]]
  native = "Я сейчас готовлю ужин."
  target = "I'm cooking dinner right now."

  [[formula.sample]]
  native = "Она разговаривает по телефону."
  target = "She is talking on the phone."

  [[formula.sample]]
  native = "Мы смотрим фильм."
  target = "We are watching a movie."

  [[formula.sample]]
  native = "Он работает над проектом."
  target = "He is working on a project."

  [[formula.sample]]
  native = "Они едут домой."
  target = "They are driving home."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I", be = "am" },
    { native = "она", target = "she", be = "is" },
    { native = "мы", target = "we", be = "are" },
    { native = "он", target = "he", be = "is" },
    { native = "они", target = "they", be = "are" },
  ]

  [[formula.slot]]
  name = "verb-ing"
  values = [
    { native = "готовлю ужин", target = "cooking dinner" },
    { native = "разговариваю по телефону", target = "talking on the phone" },
    { native = "смотрю фильм", target = "watching a movie" },
    { native = "работаю над проектом", target = "working on a project" },
    { native = "еду домой", target = "driving home" },
  ]

[[formula]]
id = "present-continuous-negation-question"
name = "Я не делаю сейчас / Ты делаешь? - Continuous"
pattern = "<pronoun> + am not/isn't/aren't + <verb-ing> ... / Am/Is/Are + <pronoun> + <verb-ing>?"
say = "<pronoun> <pronoun:be-not> <verb-ing>."
explanation = "Отрицание и вопрос в Continuous устроены так же, как у обычного to be: not добавляется прямо к am/is/are (isn't working), а в вопросе am/is/are просто выходят вперёд местоимения (Is she working?). Никакого don't/does здесь нет и быть не может - это частая путаница, потому что глагол на -ing сбивает с толку и хочется добавить do."
order = 300

  [[formula.sample]]
  native = "Я сейчас не работаю."
  target = "I'm not working right now."

  [[formula.sample]]
  native = "Он не спит."
  target = "He isn't sleeping."

  [[formula.sample]]
  native = "Ты сейчас читаешь?"
  target = "Are you reading right now?"

  [[formula.sample]]
  native = "Она готовит?"
  target = "Is she cooking?"

  [[formula.sample]]
  native = "Мы не опаздываем."
  target = "We aren't running late."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I", be-not = "am not" },
    { native = "он", target = "he", be-not = "isn't" },
    { native = "ты", target = "you", be-not = "aren't" },
    { native = "она", target = "she", be-not = "isn't" },
    { native = "мы", target = "we", be-not = "aren't" },
  ]

  [[formula.slot]]
  name = "verb-ing"
  values = [
    { native = "работаю", target = "working" },
    { native = "сплю", target = "sleeping" },
    { native = "читаю", target = "reading" },
    { native = "готовлю", target = "cooking" },
    { native = "опаздываю", target = "running late" },
  ]
