[[formula]]
id = "phrasal-verb-pronoun"
name = "Выключи его - местоимение внутри"
pattern = "Can you + <phrasal>?"
say = "Can you <phrasal:verb> <phrasal:it> <phrasal:particle>?"
explanation = "Когда предмет - местоимение, it или them, частица уходит только за него: turn it off, pick them up. Сказать turn off it нельзя - это самая частая ошибка с фразовыми глаголами, и порядок здесь и есть вся формула. С существительным можно и так, и так (turn off the light, turn the light off), с местоимением - только внутрь."
order = 330
parents = ["phrasal-verb-object"]

