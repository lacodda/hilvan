# ---------------------------------------------------------------------------
# 2. there is / there are, have got - everyday existence and possession
# ---------------------------------------------------------------------------

[[formula]]
id = "there-is-are"
name = "Там есть - there is / there are"
pattern = "There is/are + <thing>"
say = "There <thing:be> <thing>."
accept = ["<thing:there> <thing>."]
explanation = "По-русски «в холодильнике есть молоко» начинается с места, а по-английски начинается с формулы there is/are - буквально «там имеется». Is берём для одного предмета, are - для нескольких. Ошибка новичка - переводить дословно и начинать с места («In the fridge is milk») или путать is/are по числу."
order = 40
parents = ["be-present-statement"]

