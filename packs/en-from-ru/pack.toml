[[formula]]
id = "collocations-make-do-take-have"
name = "Принять решение - make, do, take, have"
pattern = "Let's + make/do/take/have + <thing>"
say = "Let's <thing:verb> <thing>."
explanation = "По-русски мы «принимаем решение», «делаем перерыв», «принимаем душ», а по-английски у каждого существительного свой глагол, и угадать его по русскому нельзя: make a decision, take a break, have lunch, do the shopping. Такие сочетания - коллокации - запоминаются целиком, как одно слово: не «решение» отдельно, а make a decision. Главная путаница - make и do: make - создать что-то (make a decision, make dinner), do - выполнить работу или обязанность (do the shopping, do the dishes)."
order = 310
parents = ["lets-verb"]

