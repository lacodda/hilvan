[[formula]]
id = "present-continuous-question"
name = "Ты делаешь сейчас? - Continuous, вопрос"
pattern = "Am/Is/Are + <pronoun> + <verb-ing>?"
say = "<pronoun:be> <pronoun> <verb-ing>?"
explanation = "В вопросе am/is/are просто выходят вперёд местоимения, как в вопросе с to be: Is she working? Are you reading? Главная фраза этой формулы - What are you doing? («Что ты делаешь?»): по-русски «сейчас» часто не говорят вслух, но если речь о том, что происходит в эту минуту, это всегда Continuous, а не What do you do? - тот спрашивает, кем ты работаешь."
order = 305
parents = ["be-present-question", "present-continuous-statement"]
family = "present-continuous"
form = "question"

