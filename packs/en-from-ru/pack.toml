[[formula]]
id = "have-got"
name = "У меня есть - have / have got"
pattern = "<pronoun> + have/has (got) + <thing>"
say = "<pronoun> <pronoun:have> <thing>."
accept = ["<pronoun> <pronoun:have> got <thing>.", "<pronoun:got> <thing>."]
explanation = "У обладания в английском нет отдельного слова вроде русского «у меня» - вместо этого меняется сам глагол: have для я/ты/мы/они, has для он/она/оно. В разговорной речи часто добавляют got (I've got a car), но и просто have тоже верно. Частая ошибка - сказать «I has» или «he have», перепутав, к кому какая форма относится."
