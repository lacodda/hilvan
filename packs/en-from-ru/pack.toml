[[formula]]
id = "present-simple-he-she-it"
name = "Он делает - Present Simple с -s"
pattern = "<pronoun> + <verb-s> + <rest>"
say = "<pronoun> <verb-s> <rest>."
explanation = "С he/she/it к глаголу приклеивается звук -s: work становится works, live - lives. Это единственное место в настоящем времени, где глагол вообще меняется, и именно это место русскоговорящие чаще всего забывают - в русском окончания глагола зависят не от «он/она», а от лица и рода в прошедшем, поэтому рука не привыкла добавлять эту -s."
