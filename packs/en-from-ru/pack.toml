[[formula]]
id = "future-going-to"
name = "Я собираюсь - going to"
pattern = "<pronoun> + am/is/are going to + <verb>"
say = "<pronoun> <pronoun:be> going to <verb>."
explanation = "Going to берут для планов, о которых уже решили заранее, в отличие от will, который больше подходит для решений на ходу. Сборка идёт через to be (am/is/are), поэтому эта формула требует ту же связку, что и be-present: I'm going to, she's going to. Ошибка - забыть саму связку am/is/are и сказать просто «I going to go»."
