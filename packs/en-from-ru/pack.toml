[[formula]]
id = "present-simple-question"
name = "Ты делаешь? - Present Simple, вопрос"
pattern = "Do/Does + <pronoun> + <verb> + <rest>?"
say = "<pronoun:do> <pronoun> <verb> <rest>?"
explanation = "Вопрос начинается с do (я/ты/мы/они) или does (он/она/оно), а сам смысловой глагол снова стоит в простой форме без -s - вся работа по указанию на лицо уже сделана словом does. Ошибка новичка - спросить «Does he works?» вместо «Does he work?», либо вообще забыть do/does и спросить «He works?» с одной интонацией, как в русском."
