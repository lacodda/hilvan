# ---------------------------------------------------------------------------
# 8. Future Simple - will and going to
# ---------------------------------------------------------------------------

[[formula]]
id = "future-will-statement"
name = "Я сделаю - will"
pattern = "<pronoun> + will + <verb>"
say = "<pronoun> will <verb>."
explanation = "Will - самый простой способ говорить о будущем: одна форма на все местоимения, после неё глагол в простой форме без to. В речи will почти всегда сжимают до 'll: I'll call, we'll see. Ошибка новичка - добавить to после will (I will to go) по привычке от русского «буду» плюс инфинитив."
order = 250
family = "future-will"
form = "statement"

  [[formula.sample]]
  native = "Я позвоню тебе завтра."
  target = "I'll call you tomorrow."

  [[formula.sample]]
  native = "Она поможет нам."
  target = "She will help us."

  [[formula.sample]]
  native = "Мы встретимся в семь."
  target = "We'll meet at seven."

  [[formula.sample]]
  native = "Он купит билеты."
  target = "He will buy the tickets."

  [[formula.sample]]
  native = "Погода будет хорошая."
  target = "The weather will be nice."

  [[formula.slot]]
  name = "pronoun"
  values = [
    { native = "я", target = "I" },
    { native = "она", target = "she" },
    { native = "мы", target = "we" },
    { native = "он", target = "he" },
    { native = "они", target = "they" },
  ]

  [[formula.slot]]
  name = "verb"
  values = [
    { native = "позвоню тебе завтра", target = "call you tomorrow" },
    { native = "поможет нам", target = "help us" },
    { native = "встретимся в семь", target = "meet at seven" },
    { native = "купит билеты", target = "buy the tickets" },
    { native = "будет здесь", target = "be here" },
  ]

[[formula]]
id = "future-will-negation"
name = "Я не сделаю - won't"
pattern = "<pronoun> + won't + <verb>"
say = "<pronoun> won't <verb>."
explanation = "Отрицание will и not сливается в won't - это стоит просто запомнить как отдельное слово, потому что оно не выглядит как will плюс not на письме. После won't - опять простой глагол без to: I won't go, а не I won't to go."
