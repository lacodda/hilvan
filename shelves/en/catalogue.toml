# The English shelf: open texts for a learner to read next.
#
# Books of Project Gutenberg - public domain in the United States - and
# articles of the Simple English Wikipedia (CC BY-SA 4.0), written for
# readers still learning English. Nothing of their text is kept here: an
# item is fetched from its source when the learner takes it, and the text
# keeps its source as its link.
#
# Written by hand. Beside it, profiles.tsv is measured from the texts:
# `cargo test --test shelf -- --ignored` after any change here.

language = "en"

