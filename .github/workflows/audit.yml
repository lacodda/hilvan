name: Audit

# What Dependabot would otherwise be for, and the half of it this project
# keeps (docs/adr/0010-dependabot-is-off.md): published advisories against the
# dependencies, and licenses outside the accepted list. On every push and pull
# request, and on Monday mornings for what was published while nothing was
# pushed - a red run with no commit behind it means the world moved, not the
# code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # RustSec advisories, licenses, banned crates and unknown sources - all four
  # read from deny.toml.
  crates:
    name: Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The tutor app's production dependencies: they are built into the image
  # the stand serves. The dev toolchain's advisories reach the machine that
  # builds, not the learner, and they are taken in the weekly update.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Advisories
        run: pnpm audit --prod
      - name: Licenses
        run: node ../tools/check-licenses.mjs

  # The documentation site's packages, every one: the site is all build
  # tooling, and what the build writes is what ships. Advisories accepted on
  # purpose are listed, with the reason, in docs/site/pnpm-workspace.yaml.
  site:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Advisories
        run: pnpm audit
