name: Publish

# The container image, published alongside the release it belongs to. hilvan
# is not a crate anyone installs: the product is an image and a compose file,
# so this is the whole of publishing.
#
# Triggered by the tag push directly (not the release event): releases are
# created by release.yml with GITHUB_TOKEN, and such events do not start other
# workflows.
on:
  push:
    tags: ['v*']
  # Buildable by hand, because a failure here must not need a new tag to retry.
  workflow_dispatch:

permissions:
  contents: read
  # Pushing to GHCR is done with the workflow's own token: no registry password
  # to store, and nothing to rotate.
  packages: write

# Two images, one version: the tutor, and the Piper voice it speaks the
# learner's own language with (`piper/`). They ship together so a compose file
# that pins HILVAN_VERSION pins both, and a voice never drifts under the
# sentences cached with it.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [hilvan, hilvan-piper]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 rather than emulation: a Rust build under QEMU takes
            # the better part of an hour, and this one has a Node stage too.
            runner: ubuntu-24.04-arm
          - image: hilvan
            context: .
            suffix: ''
          - image: hilvan-piper
            context: piper
            suffix: -piper
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each runner pushes a digest rather than a tag; the manifest below is
      # what gives the two of them one name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          # The source label is what links a new package to this repository,
          # so it takes the repository's visibility instead of starting private.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }}${{ matrix.suffix }},push-by-digest=true,name-canonical=true,push=true

      # The file's name is the digest without its `sha256:` prefix, which is
      # what `imagetools create` wants back when it assembles the manifest.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish the manifest of ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: hilvan
            suffix: ''
          - image: hilvan-piper
            suffix: -piper
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves and the version does not: someone who pinned 0.1.0 gets
      # that image forever, and someone who wrote `latest` in a compose file
      # gets whatever shipped last.
      - name: Create the multi-architecture tag
        working-directory: /tmp/digests
        env:
          NAME: ${{ env.IMAGE }}${{ matrix.suffix }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$NAME:$version" \
            --tag "$NAME:latest" \
            $(printf "$NAME@sha256:%s " *)

      - name: Show what was published
        env:
          NAME: ${{ env.IMAGE }}${{ matrix.suffix }}
        run: docker buildx imagetools inspect "$NAME:${GITHUB_REF_NAME#v}"
